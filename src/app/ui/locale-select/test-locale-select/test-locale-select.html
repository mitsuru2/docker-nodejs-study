<div class="container">
  @for (test of testCases; track $index) {
    <div>
      <h3>{{ test.title }}</h3>
      <app-locale-select
        [class]="test.id"
        [config]="test.config"
        [value]="test.value()"
        (valueChange)="test.value.set($event)"
      ></app-locale-select>
    </div>
  }
</div>
<p-toast></p-toast>
