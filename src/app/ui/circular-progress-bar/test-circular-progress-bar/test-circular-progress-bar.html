<div class="container">
  @for (test of testCases; track $index) {
    <div>
      <h3>{{ test.title }}</h3>
      <app-circular-progress-bar
        [class]="test.config.id"
        [config]="test.config"
        [progress]="progress()"
        class="cpb-cmn"
      ></app-circular-progress-bar>
    </div>
  }
</div>
