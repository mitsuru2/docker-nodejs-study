<!-- SVGコンテナ: 円形プログレスバーの描画領域 -->
<svg
  class="circular-progress"
  [id]="id()"
  [attr.viewBox]="viewBox()"
  [attr.width]="size()"
  [attr.height]="size()"
>
  <defs>
    <!-- マスク定義: グラデーション背景を円弧状に切り抜くための形状 -->
    <mask [id]="'progressMask-' + id()">
      <circle
        [attr.cx]="center()"
        [attr.cy]="center()"
        [attr.r]="radius()"
        [attr.stroke-width]="strokeWidth()"
        fill="none"
        stroke="white"
        stroke-linecap="round"
        [attr.stroke-dasharray]="circumference()"
        [attr.stroke-dashoffset]="offset()"
        [attr.transform]="'rotate(-90 ' + center() + ' ' + center() + ')'"
        style="transition: stroke-dashoffset 0.5s ease-in-out"
      ></circle>
    </mask>
  </defs>

  <!-- 中央の画像コンテナ: 円の内側に画像を表示 -->
  <foreignObject
    [attr.x]="strokeWidth()"
    [attr.y]="strokeWidth()"
    [attr.width]="size() - strokeWidth() * 2 + 1"
    [attr.height]="size() - strokeWidth() * 2 + 1"
  >
    <xhtml:div class="image-container">
      <app-circular-image
        [config]="imageConfig()"
        [style]="'width: ' + (size() - strokeWidth() * 2 + 1) + 'px;'"
      >
      </app-circular-image>
    </xhtml:div>
  </foreignObject>

  <!-- 背景の円: プログレスバーの下地 -->
  <circle
    class="progress-background"
    [attr.cx]="center()"
    [attr.cy]="center()"
    [attr.r]="radius()"
    [attr.stroke-width]="strokeWidth()"
  />

  <!-- グラデーションプログレスバー本体: conic-gradientの背景をマスクで円弧状に切り抜き -->
  <foreignObject
    x="0"
    y="0"
    [attr.width]="size()"
    [attr.height]="size()"
    [attr.mask]="'url(#progressMask-' + id() + ')'"
  >
    <xhtml:div class="progress-gradient-fill"></xhtml:div>
  </foreignObject>
</svg>
