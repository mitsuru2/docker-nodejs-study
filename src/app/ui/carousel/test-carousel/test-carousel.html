<div class="container">
  @for (test of testCases; track $index) {
    <div>
      <h3>{{ test.title }}</h3>
      <div [class]="test.id + '-box'">
        <app-carousel
          [class]="test.id"
          [config]="test.config"
          (clicked)="clickHandler($event)"
        ></app-carousel>
      </div>
    </div>
  }
</div>
<p-toast></p-toast>
