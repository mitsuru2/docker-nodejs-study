<div class="viewport">
  <div
    class="track"
    [style.--p-image-offset]="imageOffset()"
    [style.transition]="isTransitioning ? 'transform 0.5s ease-out' : 'none'"
    (transitionend)="onTransitionEnd()"
  >
    @for (item of displayItems(); track $index) {
      <div #imgElement class="item-wrapper">
        <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
        <img
          class="image"
          [src]="item.path"
          [alt]="item.alt"
          (load)="refresh()"
          (click)="imageClickHandler(item.id)"
        />
        @if (item.title && isImageLoaded()) {
          <div class="image-title-overlay">{{ item.title }}</div>
        }
      </div>
    }
  </div>
  @if (showOverlay()) {
    <div class="overlay">
      <div class="left"></div>
      <div class="right"></div>
    </div>
  }
</div>

@if (showDots()) {
  <div class="dots">
    @for (_ of [].constructor(imageNum()); track $index) {
      <button
        type="button"
        class="dot"
        [class.active]="currentIndex() % imageNum() === $index"
        [attr.aria-label]="$index + 1 + '枚目の画像を表示'"
        (click)="dotClickHandler($index)"
      ></button>
    }
  </div>
}
