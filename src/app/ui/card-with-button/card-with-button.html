<p-card class="card">
  <div
    class="container"
    role="button"
    tabindex="0"
    (click)="clickedHandler(buttonId())"
    (keydown.enter)="clickedHandler(buttonId())"
    (keydown.space)="$event.preventDefault(); clickedHandler(buttonId())"
  >
    <div class="message-area">
      @if (title()) {
        <h3>{{ title() | localize }}</h3>
      }
      <div>
        <ng-content></ng-content>
      </div>
    </div>
    <!-- <div class="divider"></div> -->

    <!-- <p-button
      [id]="buttonId()"
      [label]="buttonLabel()"
      [icon]="buttonIcon()"
      [outlined]="false"
      size="small"
      [rounded]="buttonRounded()"
      [severity]="buttonSeverity()"
    ></p-button> -->
  </div>
</p-card>
