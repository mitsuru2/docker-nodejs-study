@if (showSplash()) {
  <app-splash class="splash" animate.leave="fade-out" [progress]="initProgress()"></app-splash>
}

@if (showMain()) {
  <app-app-shell>
    <app-carousel
      class="carousel"
      [config]="carousel()"
      (clicked)="carouselClickedHandler($event)"
    ></app-carousel>
    <div>home works!</div>
  </app-app-shell>
}
