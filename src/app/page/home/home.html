@if (showSplash()) {
  <app-splash class="splash" animate.leave="fade-out" [progress]="initProgress()"></app-splash>
  @for (img of carousel().images; track img.path) {
    <img [src]="img.path" style="display: none" (load)="onImageLoad(img.path)" />
  }
}

<app-app-shell [style.display]="showMain() ? 'flex' : 'none'">
  @if (showMain()) {
    <app-carousel
      class="carousel no-print"
      [config]="carousel()"
      (clicked)="carouselClickedHandler($event)"
    ></app-carousel>
  }

  <div class="card-container">
    @for (card of cardContents; track $index) {
      <app-card-with-button
        [id]="card.id"
        [config]="card.card"
        (clicked)="cardClickedHandler($event)"
      >
        @if (card.catchCopy) {
          <p class="catch-copy">{{ card.catchCopy }}</p>
        }
        @for (m of card.messages; track $index) {
          <p>{{ m }}</p>
        }
      </app-card-with-button>
    }
  </div>
</app-app-shell>
