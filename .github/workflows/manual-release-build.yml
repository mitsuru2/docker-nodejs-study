  #   permissions:
  #     contents: read
  #     id-token: write # for Azure login

  #   environment: approval # 承認が必要な環境設定

  #   steps:
  #     # Azureにログイン
  #     - name: Azure login
  #       uses: azure/login@v3
  #       with:
  #         client-id: ${{ vars.AZURE_CLIENT_ID }}
  #         tenant-id: ${{ vars.AZURE_TENANT_ID }}
  #         subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  #     # Web appの更新
  #     - name: Deploy to App Service
  #       uses: azure/webapps-deploy@v3
  #       with:
  #         app-name: ${{ vars.AZURE_WEBAPP_NAME }}
  #         images: ${{ needs.build-docker-image.outputs.image_name }}

  #     # ジョブサマリーにURLを表示
  #     - name: Print final summary
  #       run: |
  #         REVISION_NAME="${{ vars.AZURE_WEBAPP_NAME }}--sha-${{ needs.build-docker-image.outputs.short_sha }}"
  #         AZURE_LINK="https://portal.azure.com/#resource/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RG_NAME }}/providers/Microsoft.Web/sites/${{ vars.AZURE_WEBAPP_NAME }}"
  #         PUBLIC_URL=$(az webapp show \
  #           --name ${{ vars.AZURE_WEBAPP_NAME }} \
  #           --resource-group ${{ vars.AZURE_RG_NAME }} \
  #           --query "hostNames[0]" --output tsv)
  #         echo "### App Services (Release)" >> $GITHUB_STEP_SUMMARY
  #         echo "- **Application URL:** https://$PUBLIC_URL" >> $GITHUB_STEP_SUMMARY
  #         echo "- **Control Panel:** [View in Azure Portal](${AZURE_LINK})" >> $GITHUB_STEP_SUMMARY

  # --- JOB: 静的ウェブアプリのデプロイ ---
  deploy-static-web-app:
    runs-on: ubuntu-latest
    needs:
      - build-static-web-app
    permissions:
      contents: read
      id-token: write # for Azure login

    environment: approval # 承認が必要な環境設定

    steps:
      # ビルドしたSWAをダウンロード
      - name: Download SWA assets
        uses: actions/download-artifact@v8
        with:
          name: dist-swa
          path: dist/docker-nodejs-study/browser/

      # Azureにログイン
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # 静的ウェブアプリのデプロイ
      - name: Deploy SWA
        run: |
          # SWA CLIをインストール
          npm install -g @azure/static-web-apps-cli

          # SWA CLIでデプロイ (Release)
          swa deploy dist/docker-nodejs-study/browser \
            --app-name ${{ vars.AZURE_SWA_NAME }} \
            --env production \
            --no-use-keychain

      # ジョブサマリーにプレビューURLを表示
      - name: Add preview URL to summary
        run: |
          echo "### Static Web Apps (Release)" >> $GITHUB_STEP_SUMMARY
          echo "- **Application URL:** https://icy-moss-004312700.7.azurestaticapps.net/ja/" >> $GITHUB_STEP_SUMMARY
