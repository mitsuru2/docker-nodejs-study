name: Manual Release Build

on:
  workflow_dispatch: # 手動実行のみ

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.build.outputs.image_name }}
    permissions:
      contents: read
      id-token: write # for Azure login

    steps:
      # ソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v6

      # Docker　Buildkitのセットアップ
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Azureにログイン
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ACRにログイン
      - name: ACR login
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}

      # DockerイメージのビルドとACRへのプッシュ
      - name: Build Docker image
        id: build
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_NAME=${{ vars.AZURE_ACR_NAME}}.azurecr.io/app-runtime:sha-$SHORT_SHA
          docker build -f Dockerfile.release -t $IMAGE_NAME .
          docker push $IMAGE_NAME
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

  deploy-container-app:
    runs-on: ubuntu-latest
    needs: build-docker-image
    permissions:
      contents: read
      id-token: write # for Azure login

    steps:
      # Azureにログイン
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # DockerイメージのビルドとACRへのプッシュ
      - name: Deploy to ACA
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.AZURE_RG_NAME }}
          imageToDeploy: ${{ needs.build-docker-image.outputs.image_name }}
