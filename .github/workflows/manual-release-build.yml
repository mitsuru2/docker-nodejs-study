name: Manual Release Build

on:
  workflow_dispatch: # 手動実行のみ

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v6

      # Docker　Buildkitのセットアップ
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 3. GHCRへのログイン
      # - name: Log in to the Container registry
      #   uses: docker/login-action@v4
      #   with:
      #     registry: ${{ env.REGISTRY }}
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      # Docker イメージのタグを生成（コミット SHA + オプションでタグ）
      # - name: Extract metadata (tags, labels) for Docker
      #   id: meta
      #   uses: docker/metadata-action@v6
      #   with:
      #     images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      #     tags: |
      #       type=ref,event=tag
      #       type=sha,prefix=sha-

      # Azureにログイン
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ACRにログイン
      - name: ACR login
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}

      # DockerイメージのビルドとACRへのプッシュ
      - name: Build Docker image
        run: |
          IMAGE_NAME=${{ vars.AZURE_ACR_NAME}}.azurecr.io/app-runtime:sha-${{ github.sha }}
          docker build -f Dockerfile.release -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      # 5. Docker イメージをビルドしてプッシュ
      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v7
      #   with:
      #     context: .
      #     file: Dockerfile.release
      #     push: true
      #     tags: ${{ steps.meta.outputs.tags }}
      #     labels: ${{ steps.meta.outputs.labels }}

