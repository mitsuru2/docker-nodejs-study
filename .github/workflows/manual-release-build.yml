name: Manual Release Build

on:
  workflow_dispatch: # 手動実行のみ

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- JOB: アセットの準備 (DB/画像) ---
  prepare-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for Azure login
    steps:
      # ソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v6

      # Azureにログイン
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Cosmos DBにアクセスして articles コンテナの内容をエクスポート
      - name: Export DB contents
        env:
          COSMOS_ENDPOINT: ${{ vars.AZURE_COSMOS_ENDPOINT }}
          COSMOS_DB: ${{ vars.AZURE_COSMOS_DB_NAME }}
        run: |
          npm install @azure/cosmos @azure/identity
          node script/export-db.mjs

      # Blob Storageから画像データをダウンロード
      - name: Download all images
        run: |
          # imagesフォルダ直下の画像削除
          find public/images/ -maxdepth 1 -type f -print
          find public/images/ -maxdepth 1 -type f -delete

          # Blob Storageから画像データをダウンロード
          az storage blob download-batch \
            --account-name ${{ vars.AZURE_STORAGE_ACCOUNT }} \
            --auth-mode login \
            --source images \
            --destination public/images

      # 準備したアセットをアーティファクトとしてアップロード
      - name: Upload prepared assets
        uses: actions/upload-artifact@v7
        with:
          name: build-assets
          path: public/
          retention-days: 1

  # --- JOB: Dockerイメージのビルド ---
  build-docker-image:
    runs-on: ubuntu-latest
    needs: prepare-assets
    outputs:
      image_name: ${{ steps.build.outputs.image_name }}
      short_sha: ${{ steps.build.outputs.short_sha }}
    permissions:
      contents: read
      id-token: write # for Azure login

    steps:
      # ソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v6

      # 前のジョブで準備したアセットをダウンロード
      - name: Download assets
        uses: actions/download-artifact@v8
        with:
          name: build-assets
          path: public/

      # Docker　Buildkitのセットアップ
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Azureにログイン
      # (ACRへのログインに必要なため、このジョブでもログインが必要です)
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ACRにログイン
      - name: ACR login
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}

      # DockerイメージのビルドとACRへのプッシュ
      - name: Build Docker image
        id: build
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_NAME=${{ vars.AZURE_ACR_NAME}}.azurecr.io/app-runtime:sha-$SHORT_SHA
          docker build -f Dockerfile.release -t $IMAGE_NAME .
          docker push $IMAGE_NAME
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

  # --- JOB: 静的ウェブアプリのビルド ---
  build-static-web-app:
    runs-on: ubuntu-latest
    needs: prepare-assets
    permissions:
      contents: read
      id-token: write # for Azure login

    steps:
      # ソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v6

      # 前のジョブで準備したアセットをダウンロード
      - name: Download assets
        uses: actions/download-artifact@v8
        with:
          name: build-assets
          path: public/

      # Azureにログイン
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # 静的ウェブアプリのビルド
      # SWA専用ファイルのコピー
      - name: Build SWA
        run: |
          npm ci
          npm run build
          cp -r src/swa/. dist/docker-nodejs-study/browser/
          sudo apt-get update && sudo apt-get install -y tree
          tree dist/docker-nodejs-study/browser/

      # 静的ウェブアプリのデプロイ
      - name: Deploy SWA
        run: |
          # SWA CLIをインストール
          npm install -g @azure/static-web-apps-cli

          # SWA CLIでデプロイ (Preview)
          swa deploy dist/docker-nodejs-study/browser \
            --app-name ${{ vars.AZURE_SWA_NAME }} \
            --no-use-keychain

      # ジョブサマリーにプレビューURLを表示
      - name: Add preview URL to summary
        run: |
          AZURE_LINK="https://portal.azure.com/#resource/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RG_NAME }}/providers/Microsoft.Web/staticSites/${{ vars.AZURE_SWA_NAME }}/staticsite"
          echo "### Static Web Apps (Preview)" >> $GITHUB_STEP_SUMMARY
          echo "- **Application URL:** https://icy-moss-004312700-preview.eastasia.7.azurestaticapps.net/" >> $GITHUB_STEP_SUMMARY
          echo "- **Control Panel:** [View in Azure Portal](${AZURE_LINK})" >> $GITHUB_STEP_SUMMARY

      # ビルドdist/browserフォルダの内容をアーティファクトとしてアップロード
      - name: Upload build assets
        uses: actions/upload-artifact@v7
        with:
          name: dist-swa
          path: dist/docker-nodejs-study/browser/
          retention-days: 1

  # --- JOB: コンテナアプリのデプロイ (プレビュー) ---
  # ここではデプロイするけど外部からのトラフィックはまだ割り当てない。
  deploy-aca-preview:
    runs-on: ubuntu-latest
    needs: build-docker-image
    permissions:
      contents: read
      id-token: write # for Azure login

    steps:
      # Azureにログイン
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # DockerイメージのビルドとACRへのプッシュ
      # (シングルリビジョンの場合。Azure CLIでの制御に変更のため無効化。)
      # - name: Deploy to ACA
      #   uses: azure/container-apps-deploy-action@v2
      #   with:
      #     containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      #     resourceGroup: ${{ vars.AZURE_RG_NAME }}
      #     imageToDeploy: ${{ needs.build-docker-image.outputs.image_name }}

      # Container Appsにデプロイ
      # https://learn.microsoft.com/ja-jp/cli/azure/containerapp?view=azure-cli-latest#az-containerapp-update
      - name: Deploy to ACA (preview)
        run: |
          az containerapp update \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RG_NAME }} \
            --image ${{ needs.build-docker-image.outputs.image_name }} \
            --revision-suffix sha-${{ needs.build-docker-image.outputs.short_sha }}

      # ジョブサマリーにプレビューURLを表示
      - name: Add preview URL to summary
        run: |
          REVISION_NAME="${{ vars.AZURE_CONTAINER_APP_NAME }}--sha-${{ needs.build-docker-image.outputs.short_sha }}"
          # 新しく作成されたリビジョンの専用FQDNを取得
          PREVIEW_URL=$(az containerapp revision show \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RG_NAME }} \
            --revision $REVISION_NAME \
            --query "properties.fqdn" -o tsv)
          AZURE_LINK="https://portal.azure.com/#resource/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RG_NAME }}/providers/Microsoft.App/containerApps/${{ vars.AZURE_CONTAINER_APP_NAME }}"
          echo "### Container Apps (Preview)" >> $GITHUB_STEP_SUMMARY
          echo "- **Application URL:** https://$PREVIEW_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Control Panel:** [View in Azure Portal](${AZURE_LINK})" >> $GITHUB_STEP_SUMMARY

  # --- JOB: コンテナアプリのデプロイ (リリース) ---
  # 承認後にトラフィックを100%に切り替える
  deploy-aca-release:
    runs-on: ubuntu-latest
    needs: deploy-aca-preview
    permissions:
      contents: read
      id-token: write # for Azure login

    environment: approval # 承認が必要な環境設定
    # 注意: environment を指定した場合、Azure側の「フェデレーション資格情報」に
    # entity type: Environment, name: approval の追加設定が必要です。
    # これがないと azure/login ステップで認証エラー（一見シークレット未定義に見える）が発生します。

    steps:
      # Azureにログイン
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # トラフィック切り替え
      # https://learn.microsoft.com/ja-jp/cli/azure/containerapp/ingress/traffic?view=azure-cli-latest#az-containerapp-ingress-traffic-set
      - name: Deploy to ACA (release)
        run: |
          az containerapp ingress traffic set \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RG_NAME }} \
            --revision-weight latest=100

      # ジョブサマリーにURLを表示
      - name: Print final summary
        run: |
          PUBLIC_URL=$(az containerapp show \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RG_NAME }} \
            --query "properties.configuration.ingress.fqdn" --output tsv)
          echo "### Container Apps (Release)" >> $GITHUB_STEP_SUMMARY
          echo "- **Application URL:** https://$PUBLIC_URL" >> $GITHUB_STEP_SUMMARY

      # トラフィック切り替えの反映と残存リクエストの完了を待機
      - name: Wait for traffic shift to propagate
        run: sleep 30

      # ACAでトラフィックが0%のリビジョンを非アクティブ化する。
      - name: Deactivate old revisions
        run: |
          ACTIVE_REVISIONS=$(az containerapp revision list \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RG_NAME }} \
            --query "[?properties.active==\`true\` && properties.trafficWeight==\`0\`].name" -o tsv)
          for rev in $ACTIVE_REVISIONS; do
            az containerapp revision deactivate \
              --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ vars.AZURE_RG_NAME }} \
              --revision $rev
          done

  # --- JOB: App Services のリビジョン更新 ---
  # 2026-06-06: コスト削減のため、App Servicesへのデプロイは一旦保留にします。
