name: Manual Release Build

on:
  workflow_dispatch: # 手動実行のみ

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. ソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js のセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 3. 依存パッケージのインストール
      - name: Install dependencies
        run: npm ci

      # 4. Cosmos DB からデータをエクスポート
      - name: Export data from Cosmos DB
        env:
          COSMOS_ENDPOINT: ${{ secrets.COSMOS_ENDPOINT }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          COSMOS_DB: ${{ secrets.COSMOS_DB }}
        run: node script/export-db.mjs

      # 5. ビルドメタデータ (_build.json) を生成
      - name: Generate build metadata
        run: node script/generate-build-metadata.mjs

      # 6. Angular SSR アプリをビルド（エクスポートした JSON が assets として取り込まれる）
      - name: Build Angular app
        run: npm run build

      # 7. GHCRへのログイン
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Docker イメージのタグを生成（コミット SHA + オプションでタグ）
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      # 9. Docker イメージをビルドしてプッシュ
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 10. エクスポートしたデータをアーティファクトとして保存（トレーサビリティ）
      - name: Upload exported data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-export-${{ github.sha }}
          path: public/data/
          retention-days: 90
