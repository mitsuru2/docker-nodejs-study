name: Manual Release Build

on:
  workflow_dispatch: # 手動実行のみ

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- JOB: Dockerイメージのビルド ---
  build-docker-image:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.build.outputs.image_name }}
      short_sha: ${{ steps.build.outputs.short_sha }}
    permissions:
      contents: read
      id-token: write # for Azure login

    steps:
      # ソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v6

      # Docker　Buildkitのセットアップ
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Azureにログイン
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # RunnerのパブリックIPを取得してCosmos DBのファイアーウォールを許可
      # - name: Allow Runner IP
      #   run: |
      #     # IPアドレス情報の取得
      #     runnerIp=$(curl -s https://api.ipify.org)
      #     existingIps=$(az cosmosdb show \
      #       --name ${{ vars.AZURE_COSMOS_ACCOUNT}} \
      #       --resource-group ${{ vars.AZURE_RG_NAME}} \
      #       --query "ipRules[].ipAddressOrRange" \
      #       -o tsv | paste -sd "," -)
      #     echo "ORIGINAL_IP_LIST=$existingIps" >> $GITHUB_ENV

      #     # 新しいIPアドレスリストの作成
      #     if [ -n "$existingIps" ]; then
      #       newIps="$existingIps,$runnerIp"
      #     else
      #       newIps="$runnerIp"
      #     fi
      #     echo "runnerIp: $runnerIp"
      #     echo "existingIps: $existingIps"
      #     echo "newIps: $newIps"

      #     # Cosmos DBのファイアーウォールを更新
      #     az cosmosdb update \
      #       --name ${{ vars.AZURE_COSMOS_ACCOUNT }} \
      #       --resource-group ${{ vars.AZURE_RG_NAME }} \
      #       --ip-range-filter $newIps

      #     # 設定反映待ち
      #     sleep 10

      # Cosmos DBにアクセスして articles コンテナの内容をエクスポート
      - name: Export DB contents
        env:
          COSMOS_ENDPOINT: ${{ vars.AZURE_COSMOS_ENDPOINT }}
          COSMOS_DB: ${{ vars.AZURE_COSMOS_DB_NAME }}
        run: |
          npm install @azure/cosmos @azure/identity
          node script/export-db.mjs

      # IPアドレス登録の削除
      # - name: Remove Runner IP
      #   if: always()
      #   run: |
      #     echo "The original IP list: $ORIGINAL_IP_LIST"
      #     az cosmosdb update \
      #       --name ${{ vars.AZURE_COSMOS_ACCOUNT }} \
      #       --resource-group ${{ vars.AZURE_RG_NAME }} \
      #       --ip-range-filter $ORIGINAL_IP_LIST
      #     # 設定反映待ち
      #     sleep 10

      # Blob Storageから画像データをダウンロード
      - name: Download all images
        run: |
          # imagesフォルダ直下の画像削除
          find public/images/ -maxdepth 1 -type f -print
          find public/images/ -maxdepth 1 -type f -delete

          # Blob Storageから画像データをダウンロード
          # https://learn.microsoft.com/ja-jp/cli/azure/storage/blob?view=azure-cli-latest#az-storage-blob-download-batch
          # (1) Dryrun
          az storage blob download-batch \
            --account-name ${{ vars.AZURE_STORAGE_ACCOUNT }} \
            --auth-mode login\
            --source images \
            --destination public/images
            --dryrun
          # (2) 実行
          az storage blob download-batch \
            --account-name ${{ vars.AZURE_STORAGE_ACCOUNT }} \
            --auth-mode login\
            --source images \
            --destination public/images

      # ACRにログイン
      - name: ACR login
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}

      # DockerイメージのビルドとACRへのプッシュ
      - name: Build Docker image
        id: build
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_NAME=${{ vars.AZURE_ACR_NAME}}.azurecr.io/app-runtime:sha-$SHORT_SHA
          docker build -f Dockerfile.release -t $IMAGE_NAME .
          docker push $IMAGE_NAME
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

  # --- JOB: コンテナアプリのデプロイ (プレビュー) ---
  # ここではデプロイするけど外部からのトラフィックはまだ割り当てない。
  deploy-preview:
    runs-on: ubuntu-latest
    needs: build-docker-image
    permissions:
      contents: read
      id-token: write # for Azure login

    steps:
      # Azureにログイン
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # DockerイメージのビルドとACRへのプッシュ
      # (シングルリビジョンの場合。Azure CLIでの制御に変更のため無効化。)
      # - name: Deploy to ACA
      #   uses: azure/container-apps-deploy-action@v2
      #   with:
      #     containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      #     resourceGroup: ${{ vars.AZURE_RG_NAME }}
      #     imageToDeploy: ${{ needs.build-docker-image.outputs.image_name }}

      # Container Appsにデプロイ
      # https://learn.microsoft.com/ja-jp/cli/azure/containerapp?view=azure-cli-latest#az-containerapp-update
      - name: Deploy to ACA (preview)
        run: |
          az containerapp update \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RG_NAME }} \
            --image ${{ needs.build-docker-image.outputs.image_name }} \
            --revision-suffix sha-${{ needs.build-docker-image.outputs.short_sha }}

      # ジョブサマリーにプレビューURLを表示
      - name: Add preview URL to summary
        run: |
          REVISION_NAME="${{ vars.AZURE_CONTAINER_APP_NAME }}--sha-${{ needs.build-docker-image.outputs.short_sha }}"
          # 新しく作成されたリビジョンの専用FQDNを取得
          PREVIEW_URL=$(az containerapp revision show \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RG_NAME }} \
            --revision $REVISION_NAME \
            --query "properties.fqdn" -o tsv)
          echo "### Deployment Preview" >> $GITHUB_STEP_SUMMARY
          echo "- **New revision URL:** https://$PREVIEW_URL" >> $GITHUB_STEP_SUMMARY

  # --- JOB: コンテナアプリのデプロイ (リリース) ---
  # 承認後にトラフィックを100%に切り替える
  deploy-release:
    runs-on: ubuntu-latest
    needs: deploy-preview
    permissions:
      contents: read
      id-token: write # for Azure login

    environment: restricted # 承認が必要な環境設定
    # 注意: environment を指定した場合、Azure側の「フェデレーション資格情報」に
    # entity type: Environment, name: restricted の追加設定が必要です。
    # これがないと azure/login ステップで認証エラー（一見シークレット未定義に見える）が発生します。

    steps:
      # Azureにログイン
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # トラフィック切り替え
      # https://learn.microsoft.com/ja-jp/cli/azure/containerapp/ingress/traffic?view=azure-cli-latest#az-containerapp-ingress-traffic-set
      - name: Deploy to ACA (release)
        run: |
          az containerapp ingress traffic set \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RG_NAME }} \
            --revision-weight latest=100

  deactivate-old-revisions:
    runs-on: ubuntu-latest
    needs:
      - build-docker-image
      - deploy-release
    permissions:
      contents: read
      id-token: write # for Azure login
    steps:
      # Azureにログイン
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ACAでトラフィックが0%のリビジョンを非アクティブ化する。
      - name: Deactivate old revisions
        run: |
          ACTIVE_REVISIONS=$(az containerapp revision list \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RG_NAME }} \
            --query "[?properties.active==\`true\` && properties.trafficWeight==\`0\`].name" -o tsv)
          for rev in $ACTIVE_REVISIONS; do
            az containerapp revision deactivate \
              --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ vars.AZURE_RG_NAME }} \
              --revision $rev
          done

      # ジョブサマリーにプレビューURLを表示
      - name: Print final summary
        run: |
          REVISION_NAME="${{ vars.AZURE_CONTAINER_APP_NAME }}--sha-${{ needs.build-docker-image.outputs.short_sha }}"
          AZURE_LINK="https://portal.azure.com/#resource/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RG_NAME }}/providers/Microsoft.App/containerApps/${{ vars.AZURE_CONTAINER_APP_NAME }}"
          # 新しく作成されたリビジョンの専用FQDNを取得
          PREVIEW_URL=$(az containerapp revision show \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RG_NAME }} \
            --revision $REVISION_NAME \
            --query "properties.fqdn" -o tsv)
          echo "### Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Application URL:** https://tech-portfolio.victoriousdune-f71bcf6b.japaneast.azurecontainerapps.io" >> $GITHUB_STEP_SUMMARY
          echo "- **Azure Container Apps:** [View in Azure Portal](${AZURE_LINK})" >> $GITHUB_STEP_SUMMARY
