  # # 事前条件判定 (push && main branch)
  # precond_push:
  #   if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  #   runs-on: ubuntu-latest
  #   steps:
  #     # mainブランチの場合、変更ファイルを調べるためにリポジトリをチェックアウト。
  #     # メタデータだけでいいのでスパースチェックアウト。
  #     - name: Checkout repository
