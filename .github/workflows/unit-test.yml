  #     - name: Check if Docker related files changed
  #       run: |
  #         # 変更されたファイルの一覧を取得
  #         CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
  #         echo "Changed files:"
  #         echo "$CHANGED_FILES"

  #         # Docker関連ファイルが含まれているかチェック
  #         if echo "$CHANGED_FILES" | grep -E 'Dockerfile|\.dockerignore|package-lock\.json'; then
  #           echo "Docker related files changed. Cancelling this workflow to wait for Docker build."
  #           exit 1
  #         fi

  # テスト実行
  test:
    # needs:
    #   - precond_workflow
    #   - precond_push
    # 依存ジョブのいずれかがスキップされても、失敗やキャンセルがなければ実行する
    # if: >-
    #   always() &&
    #   !contains(needs.*.result, 'failure') &&
    #   !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # ソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v6

      # Node.jsのセットアップ
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # 依存関係のインストール
      - name: Install dependencies
        run: npm ci

      # ユニットテストの実行。
      - name: Run Unit Test
        run: npm run test -- --watch=false --reporters=default --reporters=junit --output-file=test-results.xml

      # テストレポートの表示
      - name: Test Report
        uses: dorny/test-reporter@v3
        if: always() # テストが失敗しても必ず実行してレポートを出す
        with:
          name: Vitest Unit Test Results
          path: test-results.xml
          reporter: java-junit

      # テストレポートの保存
      - name: Archive Test Report
        uses: actions/upload-artifact@v6
        if: always() # テストが失敗しても必ず実行してレポートを保存する
        with:
          name: vitest-junit-results
          path: test-results.xml
          retention-days: 7
