name: Publish Docker Image (develop)

on:
  # 開発用のDocker環境はDevContainerでビルドされるためイメージを管理する必要がなくなった。
  # そのため、Dockerイメージのビルドとプッシュは手動実行のみに変更する。
  workflow_dispatch: # 手動実行のみ

env:
  IMAGE_NAME: app-dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for Azure login

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Azureにログイン
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # タグの決定 (ブランチ名 + コミットハッシュ)
      - name: Resolve image tags
        id: tags
        run: |
          BRANCH_TAG=$(echo "${{ github.ref_name }}" | tr '/' '-')
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "branch_tag=$BRANCH_TAG" >> $GITHUB_OUTPUT
          echo "sha_tag=sha-$SHORT_SHA" >> $GITHUB_OUTPUT

      # ACR Tasksでリモートビルド&プッシュ (Docker-in-Dockerを使わない)
      - name: Build and push image via ACR Tasks
        run: |
          az acr build \
            --registry ${{ vars.AZURE_ACR_NAME }} \
            --target build \
            --image ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.branch_tag }} \
            --image ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha_tag }} \
            .
