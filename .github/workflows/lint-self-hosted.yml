name: Lint Check (Angular, ACI self-hosted)

# プッシュされるたびに実行。除外条件なし。
on:
  workflow_dispatch: # 手動実行のみ
  # push:

jobs:
  lint:
    runs-on: [self-hosted, aci-runner]
    permissions:
      contents: read
    steps:
      # ソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v6

      # 依存関係のインストール
      # (runnerイメージにNode.js 24が同梱されているため、actions/setup-nodeは不要)
      - name: Install dependencies
        run: npm ci

      # Lintコマンドの実行。
      - name: Run Lint
        run: npm run lint -- --format json --output-file eslint-report.json || true

      # 結果のサマリー表示と判定
      - name: Report Lint Results
        run: |
          # エラー数と警告数を取得 (jqを使用)
          ERRORS=$(jq '[.[].errorCount] | add // 0' eslint-report.json)
          WARNINGS=$(jq '[.[].warningCount] | add // 0' eslint-report.json)

          # サマリー (Markdown) 出力
          echo "## Lint Results" >> $GITHUB_STEP_SUMMARY
          if [ "$ERRORS" -eq "0" ] && [ "$WARNINGS" -eq "0" ]; then
             echo "No lint issues found." >> $GITHUB_STEP_SUMMARY
          else
             echo "Found **$ERRORS** errors and **$WARNINGS** warnings." >> $GITHUB_STEP_SUMMARY
             echo "" >> $GITHUB_STEP_SUMMARY
             echo "| File | Line | Type | Message |" >> $GITHUB_STEP_SUMMARY
             echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
             jq -r --arg ws "${{ github.workspace }}/" '.[] | select(.messages | length > 0) | .filePath as $path | .messages[] | "| " + ($path | sub($ws; "")) + " | " + (.line|tostring) + " | " + (if .severity == 2 then "Error" else "Warning" end) + " | " + (.message | gsub("\n"; "<br>")) + " |"' eslint-report.json >> $GITHUB_STEP_SUMMARY
          fi

          # エラーがある場合はジョブを失敗させる
          if [ "$ERRORS" -gt "0" ]; then
            exit 1
          fi
